<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="My personal portfolio website">
    <title>my website</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F67599;
        }

        header {
            background-color: #ffffff;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
        }

        nav ul li {
            display: inline;
            margin-right: 20px;
        }

        nav ul li a {
            color: #F67599;
            text-decoration: none;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        section {
            padding: 2rem;
        }

        footer {
            background-color: #ffffff;
            color: #fff;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <header><b>rogbone website</b></header>

    <main>
        <section id="home">
            <section style="color: #f6f5f5; text-align: center;">
                <h1>Welcome to my website</h1>
            </section>
        </section>
        <section style="color: #f6f5f5; text-align:left;">
            <section id="about">
                <h2>About</h2>
                <p>I'm a developer creating cool projects and learning new things.</p>
            </section>

            <section id="projects">
                <h2>Projects</h2>
                <p>Project portfolio coming soon.</p>
            </section>

            <section id="contact">
                <h2>Contact</h2>
                <p>rogbone@gmail.com</p>
            </section>
            <section style="color: #ffffff; text-align: center;">
                <h2>My social media</h2>
                <p>Instagram: @rogbone</p>
            </section>
            <section class="hero">

                <video autoplay muted loop playsinline>
                    <source src="IMG_4954-1.mov" type="video/quicktime">
                </video>
            </section>
    </main>

    <footer>
        <p>© 2026 rogbone. All rights reserved.</p>
    </footer>
</body>
<style>
    .hero {
        position: relative;
        height: 100vh;
        width: 100%;
        overflow: hidden;
    }

    .hero video {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        top: 0;
        left: 0;
        z-index: 0;
    }

    .content {
        position: relative;
        z-index: 2;
        color: white;
        text-align: center;
        padding-top: 30vh;
    }

    .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 1;
    }
</style>

</html>
